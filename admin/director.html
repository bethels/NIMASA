<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
        .reg-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
        #msg { margin-top: 10px; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>
    <div class="reg-container">
        <h2>Register Admin Director</h2>
        <input type="email" id="reg_email" placeholder="Email Address" required>
        <input type="password" id="reg_password" placeholder="Password" required>
        <button onclick="register()">Create Admin Account</button>
        <div id="msg"></div>
    </div>

    <script src="register1.js"></script>
</body>
</html>
